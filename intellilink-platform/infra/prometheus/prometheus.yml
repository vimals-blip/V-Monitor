global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'intellilink-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3001']
  - job_name: 'intellilink-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8100']
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
