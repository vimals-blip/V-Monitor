<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="vStroke" x1="16" y1="16" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with glow -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#vmBg)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Interior Network Pulse Lines -->
  <path d="M18 18 L32 32 L46 18" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M32 32 L32 48" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Bold V Vector -->
  <path d="M18 18 L32 48 L46 18" stroke="url(#vStroke)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Network Nodes -->
  <!-- Top Left -->
  <circle cx="18" cy="18" r="4.5" fill="#38BDF8"/>
  <circle cx="18" cy="18" r="2.2" fill="#FFFFFF"/>

  <!-- Top Right -->
  <circle cx="46" cy="18" r="4.5" fill="#38BDF8"/>
  <circle cx="46" cy="18" r="2.2" fill="#FFFFFF"/>

  <!-- Center Hub -->
  <circle cx="32" cy="32" r="3.5" fill="#67E8F9"/>
  <circle cx="32" cy="32" r="1.8" fill="#FFFFFF"/>

  <!-- Vertex Core Node -->
  <circle cx="32" cy="48" r="5" fill="#FFFFFF"/>
  <circle cx="32" cy="48" r="2.8" fill="#2563EB"/>
</svg>
